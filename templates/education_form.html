{% extends 'base.html' %}{% block title %}Education · ResumeFlow{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">{{ candidate.full_name }}</div><h1>{{ 'Edit education' if record else 'Add education' }}</h1></div></div><form method="post" class="panel form-grid"><label>Degree / qualification *<input name="degree" required value="{{ record.degree if record else '' }}" placeholder="B.Tech"></label><label>Institution *<input name="institution" required value="{{ record.institution if record else '' }}"></label><label>Field of study<input name="field_of_study" value="{{ record.field_of_study if record else '' }}"></label><label>Grade / CGPA<input name="grade" value="{{ record.grade if record else '' }}"></label><label>Start year<input type="number" min="1950" max="2100" name="start_year" value="{{ record.start_year if record and record.start_year else '' }}"></label><label>End year<input type="number" min="1950" max="2100" name="end_year" value="{{ record.end_year if record and record.end_year else '' }}"></label><label class="full">Details<textarea name="details" rows="3">{{ record.details if record else '' }}</textarea></label><div class="full actions"><button class="button primary">Save education</button><a class="button secondary" href="{{ url_for('candidate_detail', candidate_id=candidate.candidate_id) }}">Cancel</a></div></form>{% endblock %}
