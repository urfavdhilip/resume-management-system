{% extends 'base.html' %}{% block title %}Skills · ResumeFlow{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">{{ candidate.full_name }}</div><h1>{{ 'Edit skill' if record else 'Add skill' }}</h1></div></div><form method="post" class="panel form-grid"><label class="full">Skill name *<input name="skill_name" required maxlength="120" value="{{ record.skill_name if record else '' }}" placeholder="Python"></label><label>Category<select name="category">{% for value in skill_categories %}<option value="{{ value }}" {% if record and record.category == value %}selected{% elif not record and value == 'Technical' %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label>Proficiency<select name="proficiency">{% for value in proficiencies %}<option value="{{ value }}" {% if record and record.proficiency == value %}selected{% elif not record and value == 'Intermediate' %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><div class="full actions"><button class="button primary">Save skill</button><a class="button secondary" href="{{ url_for('candidate_detail', candidate_id=candidate.candidate_id) }}">Cancel</a></div></form>{% endblock %}
