{% extends 'base.html' %}{% block title %}{{ 'Edit' if candidate else 'Add' }} candidate · ResumeFlow{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">CANDIDATE PROFILE</div><h1>{{ 'Edit candidate' if candidate else 'Add candidate' }}</h1></div></div><form method="post" enctype="multipart/form-data" class="panel form-grid"><label>Full name *<input name="full_name" required value="{{ candidate.full_name if candidate else '' }}"></label><label>Email *<input type="email" name="email" required value="{{ candidate.email if candidate else '' }}"></label><label>Phone<input name="phone" value="{{ candidate.phone if candidate else '' }}"></label><label>Address<input name="address" value="{{ candidate.address if candidate else '' }}"></label><label class="full">Professional summary<textarea name="summary" rows="4">{{ candidate.summary if candidate else '' }}</textarea></label><label>Profile photo<input type="file" name="photo_file" accept=".png,.jpg,.jpeg,.webp"></label><label>Resume file<input type="file" name="resume_file" accept=".pdf,.doc,.docx"></label><div class="full actions"><button class="button primary">Save candidate</button><a class="button secondary" href="{{ url_for('candidates') }}">Cancel</a></div></form>{% endblock %}
